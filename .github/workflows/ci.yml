name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ matrix.node }} }
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm test
      - run: node scripts/coverage.mjs
      - run: node scripts/diff-impl.mjs
      - run: node scripts/migrations.mjs check
      - run: node scripts/inventory.mjs
